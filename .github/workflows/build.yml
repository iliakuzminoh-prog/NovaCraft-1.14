name: Build NovaCraft
on:
  workflow_dispatch:
  push:
    branches: [ main, 'nova/**' ]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore NovaCraft.sln
      - name: Build with warnings as errors
        run: dotnet build NovaCraft.sln -c Release -warnaserror --no-restore
      - name: Run unit tests
        shell: pwsh
        run: |
          dotnet test tests/NovaCraft.Tests/NovaCraft.Tests.csproj -c Release -warnaserror --no-restore --logger "console;verbosity=normal" --logger "trx;LogFileName=NovaCraft.Tests.trx" --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed with exit code $LASTEXITCODE" }
          $trx = Get-ChildItem "TestResults" -Filter "*.trx" -Recurse | Select-Object -First 1
          if (!$trx) { throw "Unit test report was not created; test execution cannot be verified." }
          [xml]$report = Get-Content $trx.FullName
          $counters = $report.TestRun.ResultSummary.Counters
          $total = [int]$counters.total
          $passed = [int]$counters.passed
          $failed = [int]$counters.failed
          if ($total -lt 1) { throw "No unit tests were executed." }
          if ($failed -gt 0) { throw "Unit tests failed: $failed/$total." }
          Write-Host "Verified unit tests: $passed passed / $total total."
      - name: Publish
        run: dotnet publish src/NovaCraft/NovaCraft.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Inspect EXE
        shell: pwsh
        run: |
          $exe = Get-Item "publish/NovaCraft.exe"
          if ($exe.Length -lt 10MB) { throw "Published EXE unexpectedly small: $($exe.Length) bytes" }
          Write-Host "NovaCraft.exe: $([math]::Round($exe.Length / 1MB,2)) MB"
      - name: Package portable ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/NovaCraft.exe -DestinationPath NovaCraft-1.14-win-x64-portable.zip -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "installer\NovaCraft.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "installer\installer-output\NovaCraft-1.14-Setup.exe")) { throw "Installer EXE was not created at installer/installer-output" }
      - name: Test installer install and uninstall
        shell: pwsh
        run: |
          $setup = (Resolve-Path "installer/installer-output/NovaCraft-1.14-Setup.exe").Path
          $testDir = Join-Path $env:RUNNER_TEMP "NovaCraft Installer Smoke Test"
          $log = Join-Path $env:RUNNER_TEMP "novacraft-installer-test.log"
          $installArgs = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$testDir`"", "/LOG=`"$log`"")
          $install = Start-Process -FilePath $setup -ArgumentList $installArgs -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Get-Content $log -ErrorAction SilentlyContinue
            throw "Installer returned exit code $($install.ExitCode)"
          }
          $installedExe = Join-Path $testDir "NovaCraft.exe"
          $uninstaller = Join-Path $testDir "unins000.exe"
          if (!(Test-Path $installedExe)) {
            Get-Content $log -ErrorAction SilentlyContinue
            throw "Smoke test failed: NovaCraft.exe was not installed"
          }
          if (!(Test-Path $uninstaller)) {
            throw "Smoke test failed: uninstaller was not created"
          }

          # Real application smoke test: the installed GUI must stay alive long enough
          # to prove that the executable itself starts, not only that the file was copied.
          $app = Start-Process -FilePath $installedExe -WorkingDirectory $testDir -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) {
            $startupLog = Join-Path $env:LOCALAPPDATA "NovaCraft\logs\startup-errors.log"
            if (Test-Path $startupLog) { Get-Content $startupLog }
            throw "Smoke test failed: NovaCraft.exe exited during startup (code $($app.ExitCode))"
          }
          Stop-Process -Id $app.Id -Force
          Write-Host "Application smoke test passed: NovaCraft.exe started and stayed alive."

          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller returned exit code $($uninstall.ExitCode)" }
          if (Test-Path $installedExe) { throw "Smoke test failed: NovaCraft.exe remains after uninstall" }
          Write-Host "Installer smoke test passed: install, file verification, uninstall."
      - uses: actions/upload-artifact@v4
        with:
          name: NovaCraft-1.14-Windows
          path: |
            installer/installer-output/NovaCraft-1.14-Setup.exe
            NovaCraft-1.14-win-x64-portable.zip
            TestResults/*.trx
            tests/NovaCraft.Tests/bin/Release/net8.0-windows/NovaCraft-Hero-Preview.png
          if-no-files-found: error
