name: Build Pruﬀy OS

on:
  workflow_dispatch:
  push:
    paths:
      - "PruffyOS/**"
      - ".github/workflows/pruffy-os.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build PruffyOS/PruffyOS.csproj -c Release --no-restore

      - name: Publish self-contained EXE
        run: >
          dotnet publish PruffyOS/PruffyOS.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o PruffyOS/publish

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "PruffyOS/publish/PruffyOS.exe"
          if (!(Test-Path $exe)) { throw "Pruﬀy OS EXE was not produced." }
          $size = (Get-Item $exe).Length
          Write-Host "EXE size: $size bytes"
          if ($size -lt 20000000) { throw "Unexpectedly small self-contained EXE." }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PruﬀyOS-Windows-x64
          path: PruffyOS/publish/PruffyOS.exe
          if-no-files-found: error
          retention-days: 14
